# Blueprint do Render: cria o banco PostgreSQL e o Web Service de uma vez.
# No painel do Render: New + > Blueprint > selecione o repositório.
databases:
  - name: allocate-db
    databaseName: allocate_db
    user: allocate
    plan: free

services:
  - type: web
    name: allocate
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: allocate-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_AUTO_INIT
        value: "true"
