<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    "colors": {

"surface-container-high": "#dfe8ff", "on-primary-fixed": "#002110", "surface-variant": "#d9e3fb",
"on-tertiary": "#ffffff", "tertiary-fixed-dim": "#86d7ac", "tertiary": "#0e6947",
"outline-variant": "#bccabe", "surface-bright": "#f9f9ff", "secondary-fixed": "#ffdcbd",
"on-background": "#111c2d", "on-secondary-fixed": "#2c1600", "on-error": "#ffffff",

"on-primary": "#ffffff", "surface-container": "#e8eeff", "on-tertiary-fixed-variant": "#005235",
"surface-tint": "#006d41", "inverse-primary": "#64dd9a", "on-secondary-fixed-variant": "#693c00",

"on-secondary-container": "#643900", "primary-fixed": "#82fab4", "primary": "#006a3f",
"secondary": "#8a5100", "primary-fixed-dim": "#64dd9a", "on-primary-fixed-variant": "#00522f",
"on-surface": "#111c2d", "surface-container-lowest": "#ffffff"
},
    "borderRadius": {"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},
    "spacing": {"margin-mobile":"16px","margin-desktop":"32px","gutter":"24px","xs":"4px","sm":"8px","md":"16px","lg":"24px","xl":"32px","xxl":"48px","unit":"4px"},
    "fontFamily": {"body-md":["Geist","sans-serif"],"headline-sm":["Geist","sans-serif"],"headline-md":["Geist","sans-serif"],"label-sm":["Geist","sans-serif"],"label-md":["Geist","sans-serif"],"body-sm":["Geist","sans-serif"],"body-lg":["Geist","sans-serif"],"display-lg":["Geist","sans-serif"],"display-lg-mobile":["Geist","sans-serif"]},
    "fontSize": {"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-sm":["24px",{"lineHeight":"32px","fontWeight":"600"}],"headline-md":["30px",{"lineHeight":"38px","fontWeight":"600"}],"label-sm":["12px",{"lineHeight":"16px","fontWeight":"500"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.05em","fontWeight":"500"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"display-lg":["48px",{"lineHeight":"60px","letterSpacing":"-0.02em","fontWeight":"700"}],"display-lg-mobile":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"700"}]}

<style>
  body { font-family: 'Geist', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0; }
  .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #bccabe; border-radius: 4px; }
</style>

<body class="h-full bg-surface-container flex items-center justify-center p-margin-mobile md:p-margin-desktop min-h-screen">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant p-xl">
  <div class="text-center mb-lg">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container rounded-full mb-md text-on-primary-container">
      <span class="material-symbols-outlined" style="font-size:28px;">medical_services</span>
    </div>
    <h1 class="font-headline-md text-headline-md text-on-surface mb-xs"> Allocate</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Gestão de Orçamentos</p>
  </div>
  <form action="/dashboard" class="space-y-lg" method="GET">
    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-sm" for="email">E-mail Corporativo</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
        <input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md placeholder-on-surface-variant/50" id="email" name="email" placeholder="admin@unimed.coop.br" required type="email">
      </div>
    </div>
    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-sm" for="password">Senha</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
        <input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md placeholder-on-surface-variant/50" id="password" name="password" placeholder="********" required type="password">
      </div>
    </div>
    <div class="flex items-center justify-between">
      <label class="flex items-center gap-2 cursor-pointer">
        <input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" type="checkbox">
        <span class="font-body-sm text-body-sm text-on-surface-variant">Lembrar de mim</span>
      </label>
      <a class="font-label-md text-label-md text-primary hover:text-primary-container font-medium transition-colors" href="recuperar-senha.html">Esqueceu a senha?</a>
    </div>
    <button class="w-full flex justify-center py-2.5 px-4 rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-[#006341] transition-colors" type="submit">Entrar</button>
  </form>
  <div class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant">
    <p>Conexão segura. Acesso restrito a administradores autorizados da Unimed.</p>
  </div>
</main>
</body></html>
